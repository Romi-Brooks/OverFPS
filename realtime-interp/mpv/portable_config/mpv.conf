# OverFPS 实时补帧 - mpv 基础配置
# 补帧/超分由 ofps.py 注入的 --vf=vapoursynth 完成, 这里放播放体验设置

# 缓存与预读 (配合"边算边播", 抗瞬时卡顿)
cache=yes
demuxer-readahead-secs=30
cache-secs=200

# 播放行为
keep-open=yes
save-position-on-quit=no

# 视频输出 (自动选择后端, 更稳)
vo=gpu-next
# 音画同步: audio 模式 (默认) 在跳转后自动丢帧追平音频。
# 回归测试 (tests/sync_test.py): display-resample 跳转后残留 20~51ms 偏差且不修复;
# audio 模式跳转前后恒为 0.000s。若更看重顺滑可改回 display-resample (代价: 跳转可能不同步)。
video-sync=audio
interpolation=no

# 硬件解码: 帧交给 VS 补帧时需要系统内存, auto-safe 会在需要时回拷
# (若出现花屏/异常, 改为 hwdec=no)
hwdec=auto-safe

# ---- 字幕 ----
# 自动加载同名外挂字幕 (同目录 .srt/.ass/.ssa/.sub), 支持内嵌字幕轨道
sub-auto=fuzzy
sub-file-paths=subs
# 中文字幕字体
sub-font=Microsoft YaHei
sub-font-size=42
sub-border-size=2.2

# 音频
audio-file-auto=fuzzy
